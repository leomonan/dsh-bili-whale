name: Test

on:
  push:
    branches: [agent-main]
  pull_request:
    branches: [agent-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Run existing test suite
        run: npm test
      - name: Bundle Cloudflare Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/whale-worker-build --config wrangler.example.jsonc
